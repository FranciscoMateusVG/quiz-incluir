# Production compose for Dokploy — quiz.programaincluir.org
#
# Dokploy injects Traefik labels, port mappings, and dokploy-network at deploy
# time — do NOT add them here. Local dev keeps using compose.yaml (unchanged).
#
# Public entrypoint: quiz-incluir-backend-e17b8a (port 8000). It serves both
# the API and the Flet UI, mounted onto the same FastAPI app object
# (app/backend/main.py) — there's no separate frontend service anymore.
#
# Required Dokploy-managed env vars (set in the Dokploy environment panel):
#   QUIZ_DB_PASSWORD   — Postgres password for the dedicated quiz DB
#   SECRET_KEY         — session-signing key for the SQLAdmin panel (generate: openssl rand -hex 32)
#   MONOREPO_AUTH_URL  — Programa Incluir auth origin. Production accepts exactly
#                        http://hono-app:3003; the only other allowed value is the
#                        approved host-only test fixture http://127.0.0.1:4503.
#   TRUSTED_PROXY_CIDRS — comma-separated exact /32 or /128 public Traefik peer(s).
#                        Required for per-client sign-in buckets in deployed environments.
#                        Empty trusts no proxy and safely attributes requests to the socket
#                        peer; broad or loopback CIDRs are rejected at application startup.
#   ADMIN_USERNAME     — SQLAdmin panel login username (must not be left unset — the
#                        app falls back to an insecure hardcoded default otherwise).
#   ADMIN_PASSWORD     — SQLAdmin panel login password (generate: openssl rand -hex 16).

services:
  quiz-incluir-backend-e17b8a:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: quiz-incluir-backend-e17b8a
    restart: unless-stopped
    environment:
      # config.py's field_validator rewrites postgresql:// to
      # postgresql+asyncpg:// automatically — plain URL is correct here.
      DATABASE_URL: postgresql://quiz:${QUIZ_DB_PASSWORD}@quiz-incluir-db-e17b8a:5432/quiz
      SECRET_KEY: ${SECRET_KEY}
      MONOREPO_AUTH_URL: ${MONOREPO_AUTH_URL}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      quiz-incluir-db-e17b8a:
        condition: service_healthy

  # Dedicated Postgres instance for quiz-incluir ONLY — explicitly not shared
  # with the existing incluir prod DB (operator requirement, 2026-08-13).
  # No host port binding on purpose: internal-only access.
  quiz-incluir-db-e17b8a:
    image: postgres:16
    container_name: quiz-incluir-db-e17b8a
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${QUIZ_DB_PASSWORD}
      POSTGRES_DB: quiz
    volumes:
      - quiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz_pgdata:
