[project]
name = "quiz-incluir"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Depending on every member here is what makes a plain `uv sync` at the repo
# root install everything for local dev, same as before the workspace split.
# Each deployed service instead runs `uv sync --package <member>` to install
# only what it needs (see render.yaml).
dependencies = [
    "quiz-backend",
    "quiz-shared",
]

[tool.uv]
package = false

[tool.uv.sources]
quiz-backend = { workspace = true }
quiz-shared = { workspace = true }
quiz-ai = { workspace = true }

[tool.uv.workspace]
members = ["app/backend", "app/shared", "app/ai"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "harlequin[postgres]>=2.5.2",
]
