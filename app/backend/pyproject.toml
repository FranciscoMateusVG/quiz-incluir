[project]
name = "quiz-backend"
version = "0.1.0"
description = "Quiz FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.14",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "sentry-sdk>=2.0.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "openai==2.53.0",
    "quiz-shared",
    "sqladmin>=0.31.0",
    "itsdangerous>=2.2.0",
    "duckdb>=1.1.0",
    "pytz>=2024.1",
    "flet[all]>=0.86.5",
    "flet-audio>=0.86.5",
    "flet-video>=0.86.5",
    "matplotlib>=3.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
quiz-shared = { workspace = true }
